  <text x="98" y="324" fill="#aebce0" font-family="Arial,sans-serif" font-size="19">Uma landing page clara, bonita e pensada para transformar</text><text x="98" y="351" fill="#aebce0" font-family="Arial,sans-serif" font-size="19">visitas em novas oportunidades.</text>
