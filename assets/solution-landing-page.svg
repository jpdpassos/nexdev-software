<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Exemplo de landing page</title>
  <desc id="desc">Prévia de uma landing page demonstrativa criada pela NexDev.</desc>
