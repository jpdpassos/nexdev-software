    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#10133e"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#27d8ff"/><stop offset="1" stop-color="#9b6cff"/></linearGradient>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <path d="M0 430 C180 350 260 460 430 380 S720 330 960 415 V540 H0Z" fill="#27d8ff" opacity=".08"/>
  <rect x="40" y="32" width="880" height="52" rx="15" fill="#0b142a" stroke="#4f6eac" stroke-opacity=".55"/>
  <circle cx="72" cy="58" r="8" fill="#27d8ff"/><text x="96" y="65" fill="#f4f6ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">AURORA STUDIO</text>
